<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>Form Pendaftaran</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 0 20px; color: #1f2937; }
    h1 { color: #1e40af; }
    label { display: block; margin: 12px 0 4px; font-weight: bold; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; }
    button { margin-top: 16px; padding: 10px 20px; background: #1e40af; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1e3a8a; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .status { margin-top: 12px; padding: 10px; border-radius: 4px; }
    .ok    { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }
    .info  { background: #dbeafe; color: #1e40af; }
    small  { color: #6b7280; }
  </style>
</head>
<body>
  <h1>Pendaftaran Event</h1>
  <small>Login: <?= user ?></small>

  <label>Nama lengkap</label>
  <input id="nama" type="text" required>

  <label>Email</label>
  <input id="email" type="email" required>

  <label>Kategori</label>
  <select id="kategori">
    <option value="Webinar">Webinar</option>
    <option value="Workshop">Workshop</option>
    <option value="Bootcamp">Bootcamp</option>
  </select>

  <button id="btn" onclick="kirim()">Daftar</button>
  <div id="status"></div>

  <script>
    function kirim() {
      const data = {
        nama:     document.getElementById("nama").value.trim(),
        email:    document.getElementById("email").value.trim(),
        kategori: document.getElementById("kategori").value
      };

      if (!data.nama)  return show("Nama wajib.", "error");
      if (!data.email) return show("Email wajib.", "error");

      const btn = document.getElementById("btn");
      btn.disabled = true;
      show("Mendaftarkan...", "info");

      google.script.run
        .withSuccessHandler((r) => {
          show(r.message, "ok");
          document.getElementById("nama").value = "";
          document.getElementById("email").value = "";
          btn.disabled = false;
        })
        .withFailureHandler((err) => {
          show("Error: " + err.message, "error");
          btn.disabled = false;
        })
        .daftarEvent(data);
    }

    function show(msg, cls) {
      const el = document.getElementById("status");
      el.className = "status " + cls;
      el.textContent = msg;
    }
  </script>
</body>
</html>
